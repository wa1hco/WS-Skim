# WS Skim — PR / main quality gate.
# Installs the Python requirements (not GPU extras, not UHD) and runs
# pytest. jt9 / WSJT-X are not installed on the runner; tests that need
# them must skip, not fail.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the documented floor. 3.12 is the practical Windows
        # install path (numpy==1.26.4 has no official 3.14 wheels).
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Version pin check
        run: python tools/dev/check-version.py

      - name: Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1 libegl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import PyQt5; print('PyQt5 ok')"

      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
          # Do not pick up a machine jt9 / UHD / GPU stack if the
          # runner happens to have one; tests that need jt9 skip.
          MAP144_GPU: "0"
        run: python -m pytest tests/ -q --tb=short
