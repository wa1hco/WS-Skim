[project]
name = "ws-skim"
version = "0.1.4"
description = "Wideband weak-signal skimmer for amateur radio"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Jeff Millar, WA1HCO", email = "wa1hco@gmail.com" },
]

# The application still runs from the repository tree (scripts/install.sh /
# scripts/windows/install.ps1 and the upcoming desktop launchers). This file records the project name and
# version; it is not a pip-install entry point.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tools/dev"]
